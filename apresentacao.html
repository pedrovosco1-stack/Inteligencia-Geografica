
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Apresentação Institucional | VOSCO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
      font-family: Arial, sans-serif;
    }

    #presentation {
      width: 100%;
      height: 100%;
      background: #111111;
    }

    #presentation iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #111111;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 3px;
      margin: 0;
    }

    #startScreen p {
      color: #aaaaaa;
      font-size: 14px;
    }

    #startButton {
      background: #b8a078;
      color: #111111;
      border: none;
      padding: 15px 28px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton:hover {
      background: #d0b58b;
    }
  </style>
</head>

<body>

  <div id="presentation">
    <iframe
      src="https://drive.google.com/file/d/1i5aDCQexnkIjtKk3J3wiX-_JgxQo-oHf/preview"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

<div id="startScreen">
   <img
  src="./icons/vosco-512.png"
  alt="VOSCO"
  style="
    width:150px;
    height:auto;
    object-fit:contain;
    margin-bottom:-12px;
  "
>
    <p>Apresentação institucional</p>
    <button id="startButton">
      INICIAR APRESENTAÇÃO EM TELA CHEIA
    </button>
    <p>Pressione ESC para retornar ao painel.</p>
  </div>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const presentation = document.getElementById("presentation");

    startButton.addEventListener("click", async () => {
      try {
        await presentation.requestFullscreen();
        startScreen.style.display = "none";
      } catch (error) {
        alert("Não foi possível ativar a tela cheia neste navegador.");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        window.close();
      }
    });
  </script>

</body>
</html>
